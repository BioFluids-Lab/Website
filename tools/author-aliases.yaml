# Author name normalisation for BibTeX imports
# ============================================================================
# One block per person. `canonical` is the single name published on the site,
# and `variants` are the spellings that resolve to them.
#
# So this file can be read as the site reads: whatever `canonical` says is what
# appears under each paper. The one exception is a person with a profile in
# data/authors/, who is published under the profile's given + family name
# instead. To show someone in full, give them a profile and re-run
#
#     python tools/normalize-authors.py content/research/publications/ --all
#
# Nothing here needs editing for that.
#
# Most variants are spellings taken from publications.bib. A few are not: a
# full name the lab supplied where the .bib only ever gave initials, and forms
# a person was published under before being renamed. Both are kept so those
# spellings still resolve to the right person.
#
# Two things to leave alone. Every person needs at least one "Last, First"
# variant: it is the only record of where the surname starts, and a profile is
# attached by matching it. And the variants taken from the .bib must keep its
# exact spelling, including its mistakes — they are what the importer's output
# is matched against.
#
# The comment on each entry is how many papers in publications.bib carry that
# person.
#
# Sections run in the order worth checking: the 4 with profiles, then the 45
# whose several spellings were merged into one person — a wrong merge fuses two
# people, and grouping started from the surname, so that is where to look —
# then the 205 with a single spelling, where only the name itself can be wrong.

people:

  # --- with a profile — published in full from data/authors/ ---------------- (4)

  # Not G. Tsangaris, a different person on the same 2007 paper.
  - canonical: Sokrates Tsangaris           # 118 papers
    variants: ["Tsangaris, S.", "Tsangaris, S.G.", "Tsangaris, Sokrates", "Tsangaris, Sokrates G."]

